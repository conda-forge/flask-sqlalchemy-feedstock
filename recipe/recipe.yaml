context:
  name: Flask-SQLAlchemy
  version: 3.0.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask_sqlalchemy/flask_sqlalchemy-${{ version }}.tar.gz
  sha256: c5765e58ca145401b52106c0f46178569243c5da25556be2c231ecc60867c5b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - flit-core <4
  run:
    - python >=${{ python_min }}
    - flask >=2.2.5
    - sqlalchemy >=1.4.18

tests:
  - python:
      imports:
        - flask_sqlalchemy
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Adds SQLAlchemy support to your Flask application
  homepage: https://github.com/pallets/flask-sqlalchemy
  repository: https://github.com/pallets/flask-sqlalchemy
  documentation: https://flask-sqlalchemy.palletsprojects.com

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors
